services:
  postgres:
    image: postgres:16-alpine
    container_name: capiso-postgres
    environment:
      POSTGRES_DB: capiso
      POSTGRES_USER: capiso
      POSTGRES_PASSWORD: change-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - capiso_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capiso -d capiso"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  capiso_postgres_data:

