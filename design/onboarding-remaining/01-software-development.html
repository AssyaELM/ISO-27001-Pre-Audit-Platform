<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NormCore onboarding — Software development</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>NormCore</span></div>
    <div class="journey">
      <div class="segments"><span class="segment done"></span><span class="segment current"></span><span class="segment"></span><span class="segment"></span><span class="segment"></span></div>
      <div class="journey-meta"><strong>Step 2 of 5</strong><i></i><span>Operating environment</span></div>
    </div>
    <div class="save-exit">Save &amp; exit</div>
  </header>
  <main class="page">
    <section class="onboarding-card">
      <div class="card-body">
        <div class="card-content">
          <div class="subprogress" style="--sub-progress:50%"><div class="subprogress-track"><span></span></div><span>Operating environment · 1 of 2</span></div>
          <h1>Software development</h1>
          <p class="question">Does your organization develop software or applications?</p>
          <div class="option-list">
            <div class="choice"><span class="radio"></span><div class="choice-text"><strong>Yes — Internal development team</strong></div></div>
            <div class="choice"><span class="radio"></span><div class="choice-text"><strong>Yes — Development is outsourced</strong></div></div>
            <div class="choice"><span class="radio"></span><div class="choice-text"><strong>Yes — Both internal and outsourced</strong></div></div>
            <div class="choice compact"><span class="radio"></span><div class="choice-text"><strong>No</strong></div></div>
            <div class="choice compact"><span class="radio"></span><div class="choice-text"><strong>Not sure</strong></div></div>
          </div>
        </div>
        <aside class="visual-panel contain"><img src="assets/software-development.png" alt="Secure software delivery environment"></aside>
      </div>
      <footer class="card-footer"><button class="button">Back</button><button class="button primary disabled">Continue</button></footer>
    </section>
  </main>
</body>
</html>
