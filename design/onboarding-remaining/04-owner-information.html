<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NormCore onboarding — Owner information</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>NormCore</span></div>
    <div class="journey">
      <div class="segments"><span class="segment done"></span><span class="segment done"></span><span class="segment done"></span><span class="segment current"></span><span class="segment"></span></div>
      <div class="journey-meta"><strong>Step 4 of 5</strong><i></i><span>Assessment owner</span></div>
    </div>
    <div class="save-exit">Save &amp; exit</div>
  </header>
  <main class="page">
    <section class="onboarding-card owner-card">
      <div class="card-body">
        <aside class="visual-panel"><img src="assets/owner-information.png" alt="Professional reviewing a readiness assessment"></aside>
        <div class="card-content">
          <div class="subprogress" style="--sub-progress:100%"><div class="subprogress-track"><span></span></div><span>Assessment owner · 1 of 1</span></div>
          <h1>Owner information</h1>
          <p class="question">What is your role in the organization?</p>
          <div class="fields">
            <div class="field-row">
              <div class="field"><label>Full name</label><div class="input readonly">Alex Morgan</div></div>
              <div class="field"><label>Work email</label><div class="input readonly">alex@company.com</div></div>
            </div>
            <div class="field"><label>Role in the organization *</label><div class="select">Select your role</div></div>
          </div>
        </div>
      </div>
      <footer class="card-footer"><button class="button">Back</button><button class="button primary disabled">Continue</button></footer>
    </section>
  </main>
</body>
</html>
